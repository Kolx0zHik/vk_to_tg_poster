name: Publish Docker image

on:
  push:
    branches:
      - main
      - "fixes/**"
      - "feature/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag to publish to GHCR"
        required: true
        default: "test-manual"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/kolx0zhik/vk_to_tg_poster
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          {
            echo "tags<<EOF"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}"
            elif [ "${{ github.ref_type }}" = "tag" ]; then
              echo "${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"
            elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "${{ env.IMAGE_NAME }}:latest"
              echo "${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
            else
              echo "${{ env.IMAGE_NAME }}:test"
              echo "${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
