general:
  cron: "*/15 * * * *"
  vk_api_version: "5.199"
  posts_limit: 10
  cache_file: data/cache.json
  log_file: data/logs/poster.log
  log_level: INFO
  timezone: Europe/Moscow
  log_rotation:
    max_bytes: 10485760
    backup_count: 5
  blocked_keywords: []
  refresh_avatars: true
  log_retention_days: 2
  semantic_dedup:
    enabled: false
    window_days: 4
    debug_log: false   # временно: писать в лог вердикт «не дубль» по каждому посту
llm:
  base_url: "https://openrouter.ai/api/v1"
  model: "inclusionai/ling-3.0-flash-sante:free"
  prompt: "Ты — помощник по удалению дубликатов постов в Telegram-канале. ..."  # обязательный системный промпт: только критерии «дубль / не дубль»; формат ответа (JSON is_duplicate/reason/matched) задаёт код, без промпта ИИ-проверка не работает
vk: {}
telegram:
  channel_id: ""
communities: []